name: FPG3 Deploy Public Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check deployment configuration
        run: |
          test -n "$HF_TOKEN" || { echo "Missing repository secret HF_TOKEN"; exit 2; }
          test -n "$HF_SPACE_REPO" || { echo "Missing repository variable HF_SPACE_REPO (example: MontyDabas/formal-proof-gate)"; exit 2; }
      - name: Build self-contained Space bundle
        run: |
          python formal_proof_challenge/deployment/build_hf_space_bundle.py \
            --output dist/formal-proof-gate-space \
            --source-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: formal-proof-gate-space-${{ github.sha }}
          path: dist/formal-proof-gate-space
      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub
      - name: Create or update Docker Space
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_REPO"]
          api = HfApi(token=token)
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="docker",
              exist_ok=True,
              private=False,
          )
          result = api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="dist/formal-proof-gate-space",
              commit_message=f"Deploy Formal Proof Gate from GitHub {os.environ['GITHUB_SHA']}",
          )
          print(result)
          print(f"Space: https://huggingface.co/spaces/{repo_id}")
          PY
