name: Challenge Engine

on:
  pull_request:
    paths:
      - 'challenge_engine/**'
      - '.github/workflows/challenge-engine.yml'
  push:
    branches:
      - main
    paths:
      - 'challenge_engine/**'
      - '.github/workflows/challenge-engine.yml'

jobs:
  challenge-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python -m unittest discover -s challenge_engine/tests -v

      - name: Capability contract
        run: |
          python challenge_engine/challenge.py --capabilities --compact > /tmp/capabilities.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/capabilities.json'))
          assert data['default_package'] == 'math'
          assert data['schema_version'] == '1.0'
          assert data['semantic_default'] == 'payload_only'
          assert data['challenge_genesis']['accepted_claims'] == 0
          assert 'false_acceptance' in data['break_conditions']
          assert 'ledger_integrity_failure' in data['break_conditions']
          names = {p['package'] for p in data['packages']}
          assert {'math','logic','code','security_audit'} <= names
          assert data['arithmetic_protocol'] == 'exact-rational-directed-enclosure-v1'
          assert data['exact_connector_decimal_lexeme'] is True
          assert data['raw_float_without_radius'] == 'INCOMPLETE'
          assert data['seam_quotient_protocol'] == 'first-visible-jet-seam-quotient-v1'
          assert data['seam_quotient_proof_bearing_model'] == 'exact_polynomial_jet'
          assert 'INVALID' in data['raw_division_by_zero']
          PY

      - name: Certified math example
        run: |
          python challenge_engine/challenge.py challenge_engine/examples/math_challenge.json --compact > /tmp/math.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/math.json'))
          assert data['result'] == 'CERTIFIED'
          assert data['formal_promotion'] is True
          assert data['challenge_genesis']['accepted_claims'] == 0
          assert data['challenge_genesis']['rules_frozen'] is True
          assert len(data['challenge_genesis']['genesis_hash']) == 64
          PY

      - name: Validated arithmetic example
        run: |
          python challenge_engine/challenge.py challenge_engine/examples/arithmetic_ball_challenge.json --compact > /tmp/arithmetic.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/arithmetic.json'))
          assert data['result'] == 'CERTIFIED'
          assert data['arithmetic_protocol'] == 'exact-rational-directed-enclosure-v1'
          assert data['arithmetic_summary']['outward_upper'] == '49/50'
          assert data['arithmetic_summary']['threshold'] == '1'
          overlap = next(x for x in data['checks'] if x['id'] == 'arithmetic_path_overlap')
          assert overlap['status'] == 'pass'
          PY

      - name: Exact seam quotient example
        run: |
          python challenge_engine/challenge.py challenge_engine/examples/seam_quotient_challenge.json --compact > /tmp/seam.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/seam.json'))
          assert data['result'] == 'CERTIFIED'
          assert data['seam_quotient_protocol'] == 'first-visible-jet-seam-quotient-v1'
          assert data['seam_quotient_summary']['classification'] == 'FINITE_SEAM_QUOTIENT'
          assert data['seam_quotient_summary']['quotient'] == '1/2'
          check = next(x for x in data['checks'] if x['id'] == 'seam_quotient')
          assert check['status'] == 'pass'
          PY

      - name: Non-formal adversarial example
        run: |
          python challenge_engine/challenge.py challenge_engine/examples/nonformal_behavioral_challenge.json --compact > /tmp/nonformal.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/nonformal.json'))
          assert data['result'] == 'ADVERSARIAL_PASS'
          assert data['formal_promotion'] is False
          semantic = next(x for x in data['checks'] if x['id'] == 'semantic_scope')
          assert semantic['status'] == 'pass'
          PY

      - name: Authorized security-audit example
        run: |
          python challenge_engine/challenge.py challenge_engine/examples/security_audit_challenge.json --compact > /tmp/security.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/security.json'))
          assert data['result'] == 'ADVERSARIAL_PASS'
          threat = next(x for x in data['checks'] if x['id'] == 'threat_model')
          assert threat['status'] == 'pass'
          PY

      - name: Reject undeclared semantics
        run: |
          python - <<'PY' > /tmp/semantic.json
          import json
          from challenge_engine.engine import evaluate_challenge
          challenge = json.load(open('challenge_engine/examples/nonformal_behavioral_challenge.json'))
          challenge['semantics'] = {'mode':'adapter_declared'}
          challenge.pop('semantic_adapter', None)
          print(json.dumps(evaluate_challenge(challenge)))
          PY
          python - <<'PY'
          import json
          data = json.load(open('/tmp/semantic.json'))
          assert data['result'] == 'SEMANTICS_NOT_IN_SCOPE'
          PY
